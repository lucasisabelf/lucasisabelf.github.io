*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.9rem}
.res{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.res span{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:.9rem}
.res b{font-size:1.1rem}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filtros input,.filtros select{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);min-width:0}
.filtros input[type=search]{flex:1 1 200px}
.filtros label{display:flex;align-items:center;gap:6px;font-size:.9rem}
article{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:12px;padding:12px 14px}
article:target{outline:2px solid var(--ac)}
article h2{font-size:1.05rem;margin:0 0 4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mut);font-size:.88rem;margin-bottom:8px}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.78rem;font-weight:600}
.t-aberto{background:var(--okb);color:var(--ok)}
.t-encerrado,.t-semdata{background:var(--enb);color:var(--en)}
.t-confirmado{background:var(--okb);color:var(--ok)}
.t-revisar{background:var(--rvb);color:var(--rv)}
.links a{color:var(--ac);margin-right:12px;font-size:.9rem}
.tw{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600;white-space:nowrap}
td.n{text-align:right;white-space:nowrap}
details summary{cursor:pointer;color:var(--ac);font-size:.9rem;margin-top:6px}
.obs{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.vazio{color:var(--mut);padding:20px;text-align:center}
footer{color:var(--mut);font-size:.82rem;margin:18px 0}
</style>
</head>
